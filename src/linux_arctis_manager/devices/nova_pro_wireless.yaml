device:
  name: SteelSeries Arctis Nova Pro Wireless
  vendor_id: 0x1038
  product_ids:
    - 0x12e0 # SteelSeries Arctis Nova Pro Wireless
    - 0x12e5 # SteelSeries Arctis Nova Pro Wireless X
    - 0x225d # SteelSeries Arctis Nova Pro Wireless X
  command_padding:
    length: 64
    position: end
    filler: 0x00

  command_interface_index: [4, 0] # bInterfaceNumber, bAlternateSetting
  listen_interface_indexes: [4] # bInterfaceNumber

  device_init:
    # Only identified commands. The previous init (captured from the vendor software) also sent
    # unidentified commands (0x20, 0x10, 0x3b, 0x80, 0x85, 0xb2, 0x47, 0x83, 0x89, 0xb3, 0x43,
    # 0x69, 0x8d, 0xb7); one of them locked the base station's own EQ menu until a power cycle.
    - [0x06, 0x33, 'settings.eq_band_1', 'settings.eq_band_2', 'settings.eq_band_3', 'settings.eq_band_4', 'settings.eq_band_5', 'settings.eq_band_6', 'settings.eq_band_7', 'settings.eq_band_8', 'settings.eq_band_9', 'settings.eq_band_10']
    - [0x06, 0xc3, 'settings.wireless_mode']
    - [0x06, 0x2e, 'settings.eq_preset']
    - [0x06, 0xc1, 'settings.pm_shutdown']
    - [0x06, 0x37, 'settings.mic_volume']
    - [0x06, 0x27, 'settings.gain']
    - [0x06, 0x39, 'settings.mic_side_tone']
    - [0x06, 0xbf, 'settings.mic_led_brightness']
    - [0x06, 0x49, 0x01] # Enable ChatMix (dial reported to the host)
    - ['status.request']
  # Settings changed on the base station itself, reported back so the app follows them
  settings_feedback:
    - starts_with: 0x072e   # 07 2e <preset>
      setting: eq_preset
      value_index: 2
    - starts_with: 0x0731   # 07 31 <band 1-10> <value>
      setting_index: 2
      settings: [eq_band_1, eq_band_2, eq_band_3, eq_band_4, eq_band_5, eq_band_6, eq_band_7, eq_band_8, eq_band_9, eq_band_10]
      value_index: 3
  status:
    request: 0x06b0
    response_mapping:
      - starts_with: 0x0725
        station_volume: 0x02

      - starts_with: 0x0745
        media_mix: 0x02
        chat_mix: 0x03

      - starts_with: 0x06b0
        bluetooth_powerup_state: 0x02
        bluetooth_auto_mute: 0x03
        bluetooth_power_status: 0x04
        bluetooth_connection: 0x05
        headset_battery_charge: 0x06
        charge_slot_battery_charge: 0x07
        transparent_noise_cancelling_level: 0x08
        mic_status: 0x09
        noise_cancelling: 0x0a
        mic_led_brightness: 0x0b
        auto_off_time_minutes: 0x0c
        wireless_mode: 0x0d
        wireless_pairing: 0x0e
        headset_power_status: 0x0f
    representation:
      headset:
        - headset_power_status
        - headset_battery_charge
        - noise_cancelling
        - transparent_noise_cancelling_level
        - auto_off_time_minutes
      mic:
        - mic_status
        - mic_led_brightness
      gamedac:
        - station_volume
        - charge_slot_battery_charge
      chatmix:
        - media_mix
        - chat_mix
      bluetooth:
        - bluetooth_powerup_state
        - bluetooth_power_status
        - bluetooth_auto_mute
        - bluetooth_connection
      wireless:
        - wireless_mode
        - wireless_pairing
  
  online_status:
    status_variable: headset_power_status
    online_value: online

  settings:
    headset:
      gain:
        type: discrete_map
        values_mapping:
          0x01: low
          0x02: high
        default: 0x02 # high
        update_sequence: [0x06, 0x27, 'value']
    microphone:
      mic_volume:
        type: slider
        min: 0x01
        max: 0x0a
        step: 1
        min_label: mic_muted
        max_label: perc_100
        default: 0x0a # 100%
        update_sequence: [0x06, 0x37, 'value']
      mic_side_tone:
        type: discrete_map
        values_mapping:
          0x00: off
          0x01: low
          0x02: medium  
          0x03: high
        default: 0x00 # off
        update_sequence: [0x06, 0x39, 'value']
      mic_led_brightness:
        type: slider
        min: 0x01
        max: 0x0a
        step: 1
        min_label: perc_10
        max_label: perc_100
        default: 0x0a # 100%
        update_sequence: [0x06, 0xbf, 'value']
    equalizer:
      # Bands: 0x14 = 0 dB, 0.5 dB per step, 0x00 = -10 dB, 0x28 = +10 dB.
      # Band gains only affect the sound while the Custom preset is selected.
      eq_preset:
        type: discrete_map
        values_mapping:
          0x00: flat
          0x01: bass_boost
          0x02: focus
          0x03: smiley
          0x04: custom
        default: 0x00 # flat
        update_sequence:
          - [0x06, 0x2e, 'value']
          - [0x06, 0x09] # Save to the station (as HeadsetControl does after a preset change)
      eq_band_1:
        band_label: 32 Hz
        type: slider
        min: 0x00
        max: 0x28
        step: 1
        min_label: -10 dB
        max_label: +10 dB
        default: 0x14 # 0 dB
        values_mapping: &eq_band_db
          0x00: '-10.0 dB'
          0x01: '-9.5 dB'
          0x02: '-9.0 dB'
          0x03: '-8.5 dB'
          0x04: '-8.0 dB'
          0x05: '-7.5 dB'
          0x06: '-7.0 dB'
          0x07: '-6.5 dB'
          0x08: '-6.0 dB'
          0x09: '-5.5 dB'
          0x0a: '-5.0 dB'
          0x0b: '-4.5 dB'
          0x0c: '-4.0 dB'
          0x0d: '-3.5 dB'
          0x0e: '-3.0 dB'
          0x0f: '-2.5 dB'
          0x10: '-2.0 dB'
          0x11: '-1.5 dB'
          0x12: '-1.0 dB'
          0x13: '-0.5 dB'
          0x14: '0.0 dB'
          0x15: '+0.5 dB'
          0x16: '+1.0 dB'
          0x17: '+1.5 dB'
          0x18: '+2.0 dB'
          0x19: '+2.5 dB'
          0x1a: '+3.0 dB'
          0x1b: '+3.5 dB'
          0x1c: '+4.0 dB'
          0x1d: '+4.5 dB'
          0x1e: '+5.0 dB'
          0x1f: '+5.5 dB'
          0x20: '+6.0 dB'
          0x21: '+6.5 dB'
          0x22: '+7.0 dB'
          0x23: '+7.5 dB'
          0x24: '+8.0 dB'
          0x25: '+8.5 dB'
          0x26: '+9.0 dB'
          0x27: '+9.5 dB'
          0x28: '+10.0 dB'
        update_sequence: [0x06, 0x33, 'settings.eq_band_1', 'settings.eq_band_2', 'settings.eq_band_3', 'settings.eq_band_4', 'settings.eq_band_5', 'settings.eq_band_6', 'settings.eq_band_7', 'settings.eq_band_8', 'settings.eq_band_9', 'settings.eq_band_10']
      eq_band_2:
        band_label: 64 Hz
        type: slider
        min: 0x00
        max: 0x28
        step: 1
        min_label: -10 dB
        max_label: +10 dB
        default: 0x14 # 0 dB
        values_mapping: *eq_band_db
        update_sequence: [0x06, 0x33, 'settings.eq_band_1', 'settings.eq_band_2', 'settings.eq_band_3', 'settings.eq_band_4', 'settings.eq_band_5', 'settings.eq_band_6', 'settings.eq_band_7', 'settings.eq_band_8', 'settings.eq_band_9', 'settings.eq_band_10']
      eq_band_3:
        band_label: 125 Hz
        type: slider
        min: 0x00
        max: 0x28
        step: 1
        min_label: -10 dB
        max_label: +10 dB
        default: 0x14 # 0 dB
        values_mapping: *eq_band_db
        update_sequence: [0x06, 0x33, 'settings.eq_band_1', 'settings.eq_band_2', 'settings.eq_band_3', 'settings.eq_band_4', 'settings.eq_band_5', 'settings.eq_band_6', 'settings.eq_band_7', 'settings.eq_band_8', 'settings.eq_band_9', 'settings.eq_band_10']
      eq_band_4:
        band_label: 250 Hz
        type: slider
        min: 0x00
        max: 0x28
        step: 1
        min_label: -10 dB
        max_label: +10 dB
        default: 0x14 # 0 dB
        values_mapping: *eq_band_db
        update_sequence: [0x06, 0x33, 'settings.eq_band_1', 'settings.eq_band_2', 'settings.eq_band_3', 'settings.eq_band_4', 'settings.eq_band_5', 'settings.eq_band_6', 'settings.eq_band_7', 'settings.eq_band_8', 'settings.eq_band_9', 'settings.eq_band_10']
      eq_band_5:
        band_label: 500 Hz
        type: slider
        min: 0x00
        max: 0x28
        step: 1
        min_label: -10 dB
        max_label: +10 dB
        default: 0x14 # 0 dB
        values_mapping: *eq_band_db
        update_sequence: [0x06, 0x33, 'settings.eq_band_1', 'settings.eq_band_2', 'settings.eq_band_3', 'settings.eq_band_4', 'settings.eq_band_5', 'settings.eq_band_6', 'settings.eq_band_7', 'settings.eq_band_8', 'settings.eq_band_9', 'settings.eq_band_10']
      eq_band_6:
        band_label: 1 kHz
        type: slider
        min: 0x00
        max: 0x28
        step: 1
        min_label: -10 dB
        max_label: +10 dB
        default: 0x14 # 0 dB
        values_mapping: *eq_band_db
        update_sequence: [0x06, 0x33, 'settings.eq_band_1', 'settings.eq_band_2', 'settings.eq_band_3', 'settings.eq_band_4', 'settings.eq_band_5', 'settings.eq_band_6', 'settings.eq_band_7', 'settings.eq_band_8', 'settings.eq_band_9', 'settings.eq_band_10']
      eq_band_7:
        band_label: 2 kHz
        type: slider
        min: 0x00
        max: 0x28
        step: 1
        min_label: -10 dB
        max_label: +10 dB
        default: 0x14 # 0 dB
        values_mapping: *eq_band_db
        update_sequence: [0x06, 0x33, 'settings.eq_band_1', 'settings.eq_band_2', 'settings.eq_band_3', 'settings.eq_band_4', 'settings.eq_band_5', 'settings.eq_band_6', 'settings.eq_band_7', 'settings.eq_band_8', 'settings.eq_band_9', 'settings.eq_band_10']
      eq_band_8:
        band_label: 4 kHz
        type: slider
        min: 0x00
        max: 0x28
        step: 1
        min_label: -10 dB
        max_label: +10 dB
        default: 0x14 # 0 dB
        values_mapping: *eq_band_db
        update_sequence: [0x06, 0x33, 'settings.eq_band_1', 'settings.eq_band_2', 'settings.eq_band_3', 'settings.eq_band_4', 'settings.eq_band_5', 'settings.eq_band_6', 'settings.eq_band_7', 'settings.eq_band_8', 'settings.eq_band_9', 'settings.eq_band_10']
      eq_band_9:
        band_label: 8 kHz
        type: slider
        min: 0x00
        max: 0x28
        step: 1
        min_label: -10 dB
        max_label: +10 dB
        default: 0x14 # 0 dB
        values_mapping: *eq_band_db
        update_sequence: [0x06, 0x33, 'settings.eq_band_1', 'settings.eq_band_2', 'settings.eq_band_3', 'settings.eq_band_4', 'settings.eq_band_5', 'settings.eq_band_6', 'settings.eq_band_7', 'settings.eq_band_8', 'settings.eq_band_9', 'settings.eq_band_10']
      eq_band_10:
        band_label: 16 kHz
        type: slider
        min: 0x00
        max: 0x28
        step: 1
        min_label: -10 dB
        max_label: +10 dB
        default: 0x14 # 0 dB
        values_mapping: *eq_band_db
        update_sequence: [0x06, 0x33, 'settings.eq_band_1', 'settings.eq_band_2', 'settings.eq_band_3', 'settings.eq_band_4', 'settings.eq_band_5', 'settings.eq_band_6', 'settings.eq_band_7', 'settings.eq_band_8', 'settings.eq_band_9', 'settings.eq_band_10']
    power_management:
      pm_shutdown:
        type: discrete_map
        values_mapping:
          0x00: never
          0x01: 1_minute
          0x02: 5_minutes
          0x03: 10_minutes
          0x04: 15_minutes
          0x05: 30_minutes
          0x06: 60_minutes
        default: 0x05 # 30 minutes
        update_sequence: [0x06, 0xc1, 'value']
    wireless:
      wireless_mode:
        type: discrete_map
        values_mapping:
          0x00: speed
          0x01: range
        default: 0x00
        update_sequence: [0x06, 0xc3, 'value']

  status_parse:
    station_volume:
      type: percentage
      perc_min: 56
      perc_max: 0
    media_mix:
      type: percentage
      perc_min: 0
      perc_max: 100
    chat_mix:
      type: percentage
      perc_min: 0
      perc_max: 100
    bluetooth_powerup_state:
      type: on_off
      off: 0x00
      on: 0x01
    bluetooth_auto_mute:
      type: int_str_mapping
      values:
        0x00: off
        0x01: -12db
        0x02: on
    bluetooth_power_status:
      type: on_off
      off: 0x01
      on: 0x00
    bluetooth_connection:
      type: int_str_mapping
      values:
        0x00: off
        0x01: connected
        0x02: disconnected
    headset_battery_charge:
      type: percentage
      perc_min: 0
      perc_max: 8
    charge_slot_battery_charge:
      type: percentage
      perc_min: 0
      perc_max: 8
    transparent_noise_cancelling_level:
      type: percentage
      perc_min: 0
      perc_max: 10
    mic_status:
      type: int_str_mapping
      values:
        0x01: muted
        0x00: unmuted
    noise_cancelling:
      type: int_str_mapping
      values:
        0x00: off
        0x01: transparent
        0x02: on
    mic_led_brightness:
      type: percentage
      perc_min: 0
      perc_max: 10
    auto_off_time_minutes:
      type: int_int_mapping
      values:
        0x00: 0
        0x01: 1
        0x02: 5
        0x03: 10
        0x04: 15
        0x05: 30
        0x06: 60
    wireless_mode:
      type: int_str_mapping
      values:
        0x00: speed
        0x01: range
    wireless_pairing:
      type: int_str_mapping
      values:
        0x01: not_paired
        0x04: paired_offline
        0x08: connected
    headset_power_status:
      type: int_str_mapping
      values:
        0x01: offline
        0x02: cable_charging
        0x08: online
